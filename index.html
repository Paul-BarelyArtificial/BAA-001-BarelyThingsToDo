<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Barely Things To Do</title>

  <meta name="theme-color" content="#2FB9ED" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Barely ToDo" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="images/favicon-32.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css?v=1.5.0" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand-lockup">
        <img src="images/ba-logo.png" alt="Barely Artificial logo" class="brand-mark" />
        <p class="brand">Barely Artificial</p>
      </div>

      <h1>Barely Things To Do</h1>
      <p class="tagline">One thing at a time.</p>

      <div class="auth-panel">
        <p id="auth-status">Not signed in</p>
        <button id="sign-in" type="button">Sign in with Google</button>
        <button id="sign-out" class="hidden" type="button">Sign out</button>
      </div>

      <div id="email-auth" class="email-auth">
        <button id="toggle-email-auth" class="text-button" type="button">
          + Use company email
        </button>

        <div id="email-auth-form" class="email-auth-form hidden">
          <input
            id="email-auth-email"
            type="email"
            placeholder="you@barelyartificial.com"
            autocomplete="email"
          />
          <input
            id="email-auth-password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
          />

          <div class="email-auth-actions">
            <button id="email-sign-in" class="text-button" type="button">
              Sign in
            </button>
            <button id="email-sign-up" class="text-button" type="button">
              Create account
            </button>
            <button id="email-link" class="text-button hidden" type="button">
              Link to my account
            </button>
          </div>

          <p id="email-auth-status" class="email-auth-status"></p>
        </div>
      </div>
    </header>

    <div id="list-switcher" class="list-switcher" role="tablist" aria-label="Choose list">
      <button
        id="list-tab-personal"
        class="list-tab active"
        type="button"
        role="tab"
        aria-selected="true"
      >
        My List
      </button>
      <button
        id="list-tab-company"
        class="list-tab hidden"
        type="button"
        role="tab"
        aria-selected="false"
      >
        Company List
      </button>
    </div>

    <section id="priority-summary" class="priority-summary hidden" aria-label="Priority summary">
      <p class="priority-summary-label">What needs doing</p>
      <p id="priority-summary-text"></p>
    </section>

    <section class="task-entry" aria-label="Add a task">
      <label for="task-title">What needs doing tomorrow?</label>
      <input
        id="task-title"
        type="text"
        maxlength="100"
        placeholder="Add a task..."
        autocomplete="off"
      />

      <div id="new-priority-picker" class="priority-picker" role="radiogroup" aria-label="Priority">
        <button class="priority-dot" type="button" data-priority="red" aria-label="High priority"></button>
        <button class="priority-dot" type="button" data-priority="amber" aria-label="Medium priority"></button>
        <button class="priority-dot selected" type="button" data-priority="blue" aria-label="Default priority"></button>
      </div>

      <button id="toggle-notes" class="text-button" type="button">
        + Notes
      </button>

      <textarea
        id="task-notes"
        class="hidden"
        rows="3"
        placeholder="Optional notes..."
      ></textarea>

      <div class="entry-footer">
        <span id="char-count">0 / 100</span>
        <button id="add-task" type="button">Add</button>
      </div>
    </section>

    <section class="task-list-section" aria-label="Task list">
      <ul id="task-list" class="task-list"></ul>

      <div id="empty-state" class="empty-state">
        <h2>You're all caught up.</h2>
        <p>Enjoy the rest of your day.</p>
      </div>
    </section>

    <footer class="app-footer">
      <span>Barely Artificial</span>
      <span aria-hidden="true">•</span>
      <span id="app-version">v1.5.0</span>
    </footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
  <script type="module" src="js/app.js?v=1.5.0"></script>
</body>
</html>
